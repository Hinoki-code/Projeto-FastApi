<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - To-Do List</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; }
        h2 { text-align: center; color: #007BFF; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #007BFF; color: white; padding: 10px; border: none; border-radius: 4px; width: 100%; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .link { text-align: center; margin-top: 15px; font-size: 14px; }
        .link a { color: #007BFF; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Entrar</h2>
        <input type="email" id="email" placeholder="E-mail">
        <input type="password" id="senha" placeholder="Senha">
        <button onclick="login()">Entrar</button>
        <!-- O link agora aponta para a rota /register -->
        <div class="link">Não tem conta? <a href="/register">Cadastre-se</a></div>
    </div>

    <script>
       async function login() {
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;

            try {
                const resposta = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ Email: email, Senha: senha })
                });

                if (resposta.ok) {
                    const data = await resposta.json();
                    // Pega o token de dentro do objeto JSON retornado pela API
                    localStorage.setItem("tokenJwt", data.access_token);
                    window.location.href = "/dashboard";
                } else {
                    alert("E-mail ou senha inválidos.");
                }
            } catch (erro) {
                alert("Erro de conexão com a API.");
            }
        }
    </script>
</body>
</html>
