<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - To-Do List</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; }
        h2 { text-align: center; color: #007BFF; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; padding: 10px; border: none; border-radius: 4px; width: 100%; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
        .link { text-align: center; margin-top: 15px; font-size: 14px; }
        .link a { color: #007BFF; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Criar Conta</h2>
        <input type="text" id="nome" placeholder="Nome completo">
        <input type="email" id="email" placeholder="E-mail">
        <input type="password" id="senha" placeholder="Senha">
        <button onclick="registrar()">Cadastrar</button>
        <!-- O link agora aponta para a raiz / (que é a tela de login) -->
        <div class="link">Já tem uma conta? <a href="/">Faça login</a></div>
    </div>

    <script>
        async function registrar() {
            const nome = document.getElementById("nome").value;
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;

            if(!nome || !email || !senha) {
                alert("Preencha todos os campos!");
                return;
            }

            try {
                const resposta = await fetch("/UserRegister", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ Nome: nome, Email: email, Senha: senha })
                });

                if (resposta.ok) {
                    alert("Usuário cadastrado com sucesso!");
                    // Volta para a tela de login na raiz
                    window.location.href = "/";
                } else {
                    alert("Erro ao cadastrar. Verifique os dados.");
                }
            } catch (erro) {
                alert("Erro de conexão com a API.");
            }
        }
    </script>
</body>
</html>
